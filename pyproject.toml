[project]
name = "patient-call-analysis"
version = "0.1.0"
description = "Patient call analysis agent built with Deep Agents and Strands Agents"
requires-python = ">=3.11"
dependencies = [
    "deepagents",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langsmith[strands-agents]>=0.3.0",
    "langchain-anthropic",
    "python-dotenv",
    "strands-agents[anthropic]>=1.56.0,<2.0.0",
    "langgraph-cli[inmem]",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
